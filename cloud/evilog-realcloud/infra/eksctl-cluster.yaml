# eksctl create cluster -f infra/eksctl-cluster.yaml
# Real AWS cluster. Small + private. Cheap enough for an experiment; scale nodes to 0
# when idle:  eksctl scale nodegroup --cluster aiops-realcloud --name workers --nodes 0
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: aiops-realcloud
  region: ap-northeast-2
  version: "1.33"

iam:
  withOIDC: true          # 클러스터 레벨. Fluent Bit IRSA에 필요

managedNodeGroups:
  - name: workers
    instanceType: t3.large   # 2 vCPU / 8 GB — 2대 = 4 vCPU (쿼터 5 이내)
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    privateNetworking: true
    volumeSize: 40
    labels: { role: workers }
    iam:
      withAddonPolicies:
        cloudWatch: true        # so Fluent Bit / pods can write CloudWatch Logs

# CloudWatch Container Insights + Fluent Bit ship pod logs to CloudWatch.
# Enable after cluster is up:
#   aws eks create-addon --cluster-name aiops-realcloud --addon-name amazon-cloudwatch-observability
