# Ships pod stdout to CloudWatch Logs.
#
# PREREQUISITES (run once, replace <ACCOUNT_ID> and <CLUSTER>):
#
#   eksctl utils associate-iam-oidc-provider \
#     --cluster <CLUSTER> --region ap-northeast-2 --approve
#
#   eksctl create iamserviceaccount \
#     --name fluent-bit --namespace amazon-cloudwatch \
#     --cluster <CLUSTER> --region ap-northeast-2 \
#     --attach-policy-arn arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy \
#     --approve --override-existing-serviceaccounts
#
# Log group: /aiops-lab/realworld
---
apiVersion: v1
kind: Namespace
metadata:
  name: amazon-cloudwatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             5
        Log_Level         info
        Daemon            off
        Parsers_File      parsers.conf

    [INPUT]
        Name              tail
        Tag               app.*
        Path              /var/log/containers/realworld-api-*.log
        Parser            cri
        DB                /var/log/flb_app.db
        Mem_Buf_Limit     16MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # The container writes JSON on stdout; lift it into real fields so
    # CloudWatch Logs Insights can query them directly.
    [FILTER]
        Name              parser
        Match             app.*
        Key_Name          log
        Parser            json_app
        Reserve_Data      On

    [OUTPUT]
        Name              cloudwatch_logs
        Match             app.*
        region            ap-northeast-2
        log_group_name    /aiops-lab/realworld
        log_stream_prefix realworld-
        auto_create_group true

  parsers.conf: |
    [PARSER]
        Name   cri
        Format regex
        Regex  ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        json_app
        Format      json
        Time_Key    ts
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep   On
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/logs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-role
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: amazon-cloudwatch
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: amazon-cloudwatch
spec:
  selector:
    matchLabels: { k8s-app: fluent-bit }
  template:
    metadata:
      labels: { k8s-app: fluent-bit }
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      containers:
        - name: fluent-bit
          image: amazon/aws-for-fluent-bit:stable
          imagePullPolicy: Always
          resources:
            limits:   { memory: 200Mi }
            requests: { cpu: 100m, memory: 100Mi }
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap: { name: fluent-bit-config }
        - name: varlog
          hostPath: { path: /var/log }
        - name: varlibdockercontainers
          hostPath: { path: /var/lib/docker/containers }
