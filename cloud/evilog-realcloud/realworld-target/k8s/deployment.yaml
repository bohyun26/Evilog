apiVersion: v1
kind: Namespace
metadata:
  name: aiops-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realworld-api
  namespace: aiops-lab
  labels: { app: realworld-api }
spec:
  replicas: 1          # keep at 1: the incident is per-pod pool exhaustion
  selector:
    matchLabels: { app: realworld-api }
  template:
    metadata:
      labels: { app: realworld-api }
    spec:
      containers:
        - name: api
          # Replace <ACCOUNT_ID> with your AWS account number.
          image: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/realworld-target:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: realworld-api
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_POOL_TIMEOUT_S
              value: "2.0"
            - name: SLOW_QUERY_MS
              value: "20"
            - name: FEED_PAGE_SIZE
              value: "10"
            - name: ATTACK_SURFACES
              value: "a1,a2,a3,a4"
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            # deliberately /healthz, NOT /readyz -- we do not want
            # Kubernetes restarting the pod in the middle of the incident
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: realworld-api
  namespace: aiops-lab
spec:
  type: LoadBalancer
  selector: { app: realworld-api }
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
