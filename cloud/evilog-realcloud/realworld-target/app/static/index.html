<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conduit — a place to write</title>
<style>
  :root {
    --ink: #16201c;
    --paper: #f7f5ef;
    --rule: #d6d1c4;
    --moss: #3f6b52;
    --clay: #a8553a;
    --dim: #6b6a63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 ui-serif, Georgia, "Times New Roman", serif;
  }
  header {
    border-bottom: 1px solid var(--rule);
    padding: 20px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--moss); }
  .tag {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--dim);
  }
  main { max-width: 720px; margin: 0 auto; padding: 28px 24px 64px; }
  .status {
    border: 1px solid var(--rule);
    padding: 12px 14px;
    margin-bottom: 28px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .ok { color: var(--moss); }
  .bad { color: var(--clay); }
  article {
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
  }
  article h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  article p { margin: 0 0 6px; color: var(--dim); font-size: 15px; }
  .by {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--moss);
    letter-spacing: 0.04em;
  }
  .empty { color: var(--dim); padding: 32px 0; }
  footer {
    max-width: 720px; margin: 0 auto; padding: 0 24px 48px;
    font-size: 13px; color: var(--dim);
  }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1>conduit<span>.</span></h1>
  <span class="tag">RealWorld reference target</span>
</header>

<main>
  <div class="status">
    <span>feed <span id="count">—</span> articles</span>
    <span>latency <span id="latency">—</span></span>
    <span id="health">checking…</span>
  </div>
  <div id="feed" class="empty">Loading the feed…</div>
</main>

<footer>
  Read the API at <code>/api/docs</code>. Health at <code>/healthz</code>.
</footer>

<script>
async function loadFeed() {
  const started = performance.now();
  const feed = document.getElementById('feed');
  const health = document.getElementById('health');
  try {
    const res = await fetch('/api/articles');
    const ms = Math.round(performance.now() - started);
    document.getElementById('latency').textContent = ms + ' ms';

    if (!res.ok) {
      health.textContent = 'feed unavailable (' + res.status + ')';
      health.className = 'bad';
      feed.className = 'empty';
      feed.textContent =
        'The feed could not be loaded. Retrying shortly.';
      return;
    }

    const data = await res.json();
    document.getElementById('count').textContent = data.articlesCount;
    health.textContent = 'healthy';
    health.className = 'ok';
    feed.className = '';
    feed.innerHTML = data.articles.slice(0, 20).map(a => `
      <article>
        <h2>${escapeHtml(a.title)}</h2>
        <p>${escapeHtml(a.description)}</p>
        <span class="by">${escapeHtml(a.author.username)}</span>
      </article>`).join('');
  } catch (err) {
    health.textContent = 'unreachable';
    health.className = 'bad';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  })[c]);
}

loadFeed();
setInterval(loadFeed, 8000);
</script>
</body>
</html>
